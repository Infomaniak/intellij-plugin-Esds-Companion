inlay.esdsTokenValues.name=Infomaniak design system token values
inlay.esdsTokenValues.description=Shows the value behind a design system token next to its call site, \
  for example 8dp after EsdsTheme.spacing.md. The values cannot be resolved by the IDE because they \
  are provided through a Compose CompositionLocal, so they are bundled with the plugin.

